 <div class="facts"><div><span>${s.avail}</span><b>${s.availV}</b></div><div><span>${s.zone}</span><b>${s.zoneV}</b></div><div><span>${s.school}</span><b>${s.schoolV}</b></div><div><span>${s.contact}</span><b style="user-select:all;word-break:break-word">${s.contactV}</b></div></div>

 ${ORDER[profile].map(id=>{const x=P[id];return`<article><span class="yr" style="font-size:13px;color:var(--muted)">${x.y}</span><h3>${x.t[lang]}</h3><p>${x[profile][lang]}</p><p style="margin-top:6px;display:flex;gap:16px;flex-wrap:wrap">${x.live?`<a href="${x.live}" target="_blank" rel="noopener">${s.tryLive}</a>`:""}${x.figma?`<a href="${x.figma}" target="_blank" rel="noopener">${s.figOpen}</a>`:""}${x.repo?`<a href="${x.repo}" target="_blank" rel="noopener">${s.repo} →</a>`:""}</p></article>`}).join("")}</div>`;
 tv.classList.add("open");$("backBtn").onclick=()=>tv.classList.remove("open");$("backBtn").focus()}
$("textBtn").onclick=textView;
$("testBtn").onclick=()=>{if(mode==="test")return finish(false);const s=L(),c=$("consent");
 c.innerHTML=`<h2>${s.cTitle}</h2><p>${s.cText}</p><div class="row"><button class="pill rec" type="button" id="cGo">${s.cGo}</button><button class="pill" type="button" id="cNo">${s.cNo}</button></div>`;c.hidden=false;$("cGo").focus();
 $("cNo").onclick=()=>c.hidden=true;$("cGo").onclick=()=>{c.hidden=true;closeSheet();mode="test";clicks=[];trail=[];detours=0;score=0;t0=performance.now();ui()}};
function finish(ok){$("tip").hidden=true;const sec=Math.round((performance.now()-t0)/1000);mode="ended";ui();drawHeat();report(ok,sec)}
function drawHeat(){const c=$("heat"),w=innerWidth,h=innerHeight;c.width=w;c.height=h;c.hidden=false;const x=c.getContext("2d");
 const o=document.createElement("canvas");o.width=w;o.height=h;const ox=o.getContext("2d");
 const blob=(px,py,r,a)=>{const g=ox.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,"rgba(0,0,0,0)");ox.fillStyle=g;ox.beginPath();ox.arc(px,py,r,0,7);ox.fill()};
 trail.forEach(([a,b])=>blob(a,b,42,.12));clicks.forEach(([a,b])=>blob(a,b,64,.85));
 const rp=document.createElement("canvas");rp.width=256;rp.height=1;const rx=rp.getContext("2d"),rg=rx.createLinearGradient(0,0,256,0);
 [[0,"#3b6cff"],[.3,"#00d0e0"],[.5,"#47e07a"],[.7,"#ffd84a"],[.85,"#ff8a2a"],[1,"#ff3b3b"]].forEach(([q,col])=>rg.addColorStop(q,col));rx.fillStyle=rg;rx.fillRect(0,0,256,1);const pal=rx.getImageData(0,0,256,1).data;
 const img=ox.getImageData(0,0,w,h),d=img.data;for(let i=0;i<d.length;i+=4){const a=d[i+3];if(a>3){const k=a*4;d[i]=pal[k];d[i+1]=pal[k+1];d[i+2]=pal[k+2];d[i+3]=Math.min(215,40+a*1.5)}else d[i+3]=0}
 x.clearRect(0,0,w,h);ox.putImageData(img,0,0);x.drawImage(o,0,0);
 clicks.forEach(([a,b],i)=>{x.fillStyle="#1d2230";x.beginPath();x.arc(a,b,12,0,7);x.fill();x.fillStyle="#fff";x.font="600 12px Instrument Sans, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(i+1,a,b+.5)})}
function report(ok,sec){const s=L(),r=$("report");
 r.innerHTML=`<h2>${ok?s.rOk:s.rStop}</h2><div class="kpis"><div><b>${sec}s</b><span>${s.time}</span></div><div><b>${clicks.length}</b><span>${s.clicks}</span></div><div><b>${detours}</b><span>${s.det}</span></div></div>
 <div class="legend"><span>${s.low}</span><i></i><span>${s.high}</span></div><p>${s.rRead}</p><p>${ok?(detours?s.rSlow:s.rFast):s.rStopT}</p><p class="note">${s.rN}</p>
 ${ok?`<p style="font-weight:600;margin-top:12px">${s.seq}</p><div class="seq">${[1,2,3,4,5,6,7].map(n=>`<button type="button" data-n="${n}" aria-pressed="${n===score}">${n}</button>`).join("")}</div><div class="seqlbl"><span>${s.lo}</span><span>${s.hi}</span></div><p class="ok" id="thx" ${score?"":"hidden"}>${s.thx}</p>`:""}
 <p class="note">${s.priv}</p><div class="row"><button class="pill" type="button" id="rClose">${s.again}</button></div>`;
 r.hidden=false;r.focus({preventScroll:true});
 r.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{score=+b.dataset.n;r.querySelectorAll("[data-n]").forEach(o=>o.setAttribute("aria-pressed",+o.dataset.n===score));$("thx").hidden=false});
 $("rClose").onclick=closeReport}
function closeReport(){$("report").hidden=true;$("heat").hidden=true;mode="idle";ui()}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("report").hidden)closeReport();else if(!$("consent").hidden)$("consent").hidden=true;else if($("textview").classList.contains("open"))$("textview").classList.remove("open");else closeSheet()});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("labo-lang",lang)}catch(e){}ui();if(current)renderSheet(current);if($("textview").classList.contains("open"))textView()});
ui();
</script>
</body>
</html>
